name: PromptGuard CI

on:
  pull_request:
    paths:
      - "promptguard.py"
      - "prompts/**"
      - "data/**"
      - "baseline.json"
      - "promptfooconfig.yaml"
      - ".github/workflows/promptguard-ci.yml"

jobs:
  regression-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run local regression eval
        run: python promptguard.py evaluate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Promptfoo eval
        run: npx --yes promptfoo@latest eval -c promptfooconfig.yaml --no-progress-bar
